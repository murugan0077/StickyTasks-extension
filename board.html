<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StickyTasks Board</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="board.css"></head>
<body class="board-page"><header class="board-header"><a class="brand" href="popup.html" aria-label="StickyTasks home"><span aria-hidden="true">▣</span> StickyTasks</a><div class="board-heading"><h1>Your task board</h1><p>Keep the important things where you can see them.</p></div><nav class="board-nav"><a href="settings.html">Settings</a><button id="clear-completed" class="text-button">Clear completed</button></nav></header>
<main class="board-main"><form id="add-task-form" class="add-form"><label class="sr-only" for="new-task">New task</label><input id="new-task" type="text" maxlength="240" placeholder="Write a task and press Enter…" autocomplete="off" required><label class="sr-only" for="new-color">New note colour</label><select id="new-color" aria-label="New note colour"><option value="yellow">Yellow</option><option value="pink">Pink</option><option value="green">Green</option><option value="blue">Blue</option><option value="orange">Orange</option></select><button class="primary-button" type="submit">Add note</button></form>
<div class="board-tools"><span><strong id="pending-count">0</strong> pending</span><nav class="filters" aria-label="Filter tasks"><button data-filter="pending" class="active" aria-pressed="true">Pending</button><button data-filter="completed" aria-pressed="false">Completed</button><button data-filter="all" aria-pressed="false">All</button></nav></div>
<section id="task-list" class="task-list board-grid" aria-label="Sticky task notes" aria-live="polite"></section><p id="empty-state" class="empty-state" hidden></p><p id="status-message" class="status-message" role="status" aria-live="polite"></p></main>
<script src="storage.js"></script><script src="common.js"></script><script src="board.js"></script></body></html>
